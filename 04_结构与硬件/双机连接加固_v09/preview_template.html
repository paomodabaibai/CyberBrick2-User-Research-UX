<!doctype html><html lang="zh"><meta charset="utf-8"><title>双机结构 v09 装配审阅</title><style>
*{box-sizing:border-box}body{margin:0;font:15px "Microsoft YaHei",sans-serif;color:#263f50;background:#f2f5f7}header{padding:20px 28px;background:white;border-bottom:1px solid #dce4e8}h1{margin:0 0 8px;font-size:24px}main{display:grid;grid-template-columns:1fr 280px;height:calc(100vh - 115px)}canvas{width:100%;height:100%;touch-action:none;cursor:grab}aside{background:white;padding:20px;overflow:auto}button,select{padding:9px;margin:4px;border:1px solid #bccbd4;background:white;border-radius:5px}label{display:block;margin:14px 0}p{line-height:1.7}.warn{color:#a55f20;font-size:13px}.legend{font-size:12px;line-height:1.8}.scene{min-width:0;position:relative}.hint{position:absolute;bottom:12px;left:20px;color:#678;font-size:12px}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{display:flex;flex-direction:column;height:100dvh}header{flex:0 0 auto}main{flex:1 1 0;min-height:0;height:auto;overflow:hidden;grid-template-columns:minmax(0,1fr) 280px}.scene{min-height:0;overflow:hidden;touch-action:none;user-select:none}canvas{position:absolute;inset:0;display:block;user-select:none;-webkit-user-select:none}aside{min-height:0;overscroll-behavior:contain}.hint{pointer-events:none}
</style><header><h1>棋甲对决 · 双机结构 v09</h1>开关安装耳孔轴已修正 / 身体39mm原高布局　<span class="warn">结构审阅，尚未实物试装</span></header><main><div class="scene"><canvas id="c"></canvas><div class="hint">拖动旋转 · 滚轮缩放 · 右侧切换显示</div></div><aside><select id="type"><option value="palm">蓝色巴掌机</option><option value="fist">红色拳头机</option></select><label><input id="body" type="checkbox" checked> 显示共用身体</label><label><input id="top" type="checkbox" checked> 显示攻击模块</label><label><input id="cover" type="checkbox" checked> 显示顶部护罩</label><label><input id="hardware" type="checkbox" checked> 显示原厂板卡、电池、开关</label><label><input id="env" type="checkbox"> 显示插头／髋舵机预留包络</label><label><input id="movingPalm" type="checkbox" checked> 显示手掌、接杆与转盘</label><label><input id="retainer" type="checkbox" checked> 显示两半限位压环</label><button data-view="iso">立体</button><button data-view="rear">背面</button><button data-view="top">俯视</button><button data-view="side">侧面</button><button id="inside">查看内部</button><p>正面：胸标和出拳方向<br>背面：USB与电源开关<br>压环可拆，承重座连接内部支架</p><p class="warn">身体39mm，巴掌高度／51mm杆距不变。承重转盘为打印滑动试验结构，需验证摩擦、回差和承载。拳头共用后侧螺丝固定护罩，实际螺钉长度仍待核定。不可批量打印。</p><div class="legend" id="legend"></div></aside></main><script id="data" type="application/json">__MESHES__</script><script>
const meshes=JSON.parse(document.getElementById('data').textContent),c=document.getElementById('c'),gl=c.getContext('webgl',{antialias:true});let yaw=-.8,pitch=.4,zoom=1,drag=null;
if(!gl)throw Error('需要浏览器支持WebGL，请改看同目录的PNG预览');
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,'attribute vec3 p; attribute vec3 n; uniform mat3 r; uniform vec2 scale; varying float light; void main(){vec3 v=r*(p-vec3(8.,0.,-3.)); gl_Position=vec4(v.xy*scale,v.z/500.,1.);light=.58+.4*abs(dot(normalize(r*n),normalize(vec3(-.3,.6,-.8))));}'));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,'precision mediump float;uniform vec4 col;varying float light;void main(){gl_FragColor=vec4(col.rgb*light,col.a);}'));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);
const loc={p:gl.getAttribLocation(prog,'p'),n:gl.getAttribLocation(prog,'n'),r:gl.getUniformLocation(prog,'r'),scale:gl.getUniformLocation(prog,'scale'),col:gl.getUniformLocation(prog,'col')};
for(const m of meshes){const a=[];for(const f of m.f){let p=m.v[f[0]],q=m.v[f[1]],v=m.v[f[2]],u=q.map((x,i)=>x-p[i]),w=v.map((x,i)=>x-p[i]),n=[u[1]*w[2]-u[2]*w[1],u[2]*w[0]-u[0]*w[2],u[0]*w[1]-u[1]*w[0]],l=Math.hypot(...n)||1;n=n.map(x=>x/l);for(const i of f)a.push(...m.v[i],...n)}m.buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,m.buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(a),gl.STATIC_DRAW);m.count=m.f.length*3;}
const $=id=>document.getElementById(id);function enabled(m){if(!$('movingPalm').checked&&(m.name.startsWith('P_')||m.name.startsWith('15_')))return false;if(!$('retainer').checked&&m.name.startsWith('14'))return false;if(m.group!=='common'&&m.group!==$('type').value)return false;if(m.kind==='body'&&!$('body').checked)return false;if(m.group!=='common'&&!$('top').checked)return false;if((m.name.startsWith('12_')||m.name.startsWith('21_'))&&!$('cover').checked)return false;if(m.kind==='envelope'&&!$('env').checked)return false;if(m.kind==='reference'&&!$('hardware').checked)return false;return true}
function draw(){let w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d);}gl.viewport(0,0,c.width,c.height);gl.clearColor(.949,.961,.969,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);let s=Math.min(w,h)/245*zoom,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);gl.uniformMatrix3fv(loc.r,false,[cy,sy*sp,sy*cp,-sy,cy*sp,cy*cp,0,cp,-sp]);gl.uniform2f(loc.scale,2*s/w,2*s/h);
for(const m of meshes.filter(enabled).sort((a,b)=>(a.kind==='envelope')-(b.kind==='envelope'))){gl.bindBuffer(gl.ARRAY_BUFFER,m.buffer);gl.enableVertexAttribArray(loc.p);gl.vertexAttribPointer(loc.p,3,gl.FLOAT,false,24,0);gl.enableVertexAttribArray(loc.n);gl.vertexAttribPointer(loc.n,3,gl.FLOAT,false,24,12);let rgb=[1,3,5].map(i=>parseInt(m.color.slice(i,i+2),16)/255);gl.uniform4f(loc.col,...rgb,m.kind==='envelope'?.25:1);gl.depthMask(m.kind!=='envelope');gl.drawArrays(gl.TRIANGLES,0,m.count)}gl.depthMask(true);
$('legend').innerHTML=meshes.filter(m=>enabled(m)&&m.kind==='part').map(m=>`<span style="color:${m.color}">■</span> ${m.name}<br>`).join('')}
c.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();drag=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;e.preventDefault();yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];requestAnimationFrame(draw)};c.onpointerup=c.onpointercancel=c.onlostpointercapture=()=>drag=null;c.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.max(.45,Math.min(3,zoom*Math.exp(-e.deltaY*.001)));draw()},{passive:false});document.querySelectorAll('input,select').forEach(e=>e.onchange=draw);document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{[yaw,pitch]=({iso:[-.8,.4],rear:[Math.PI/2,0],top:[0,1.57],side:[0,0]})[b.dataset.view];draw()});$('inside').onclick=()=>{$('body').checked=false;$('top').checked=false;draw()};window.onresize=draw;draw();
</script></html>
