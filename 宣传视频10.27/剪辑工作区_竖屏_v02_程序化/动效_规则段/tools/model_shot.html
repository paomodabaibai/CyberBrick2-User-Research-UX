<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#20242c}</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../vendor/GLTFLoader.js';
import { RoomEnvironment } from '../vendor/RoomEnvironment.js';
const W = 900, H = 900;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); document.body.appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
const pm = new THREE.PMREMGenerator(r);
async function loadAny(url) {
  if (url.endsWith('.glb')) return (await new GLTFLoader().loadAsync(url)).scene;
  const b = await (await fetch(url)).arrayBuffer(), d = new DataView(b), n = d.getUint32(80, true), pos = new Float32Array(n * 9); let o = 84;
  for (let i = 0; i < n; i++) { o += 12; for (let j = 0; j < 9; j++) { pos[i * 9 + j] = d.getFloat32(o, true); o += 4; } o += 2; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.computeVertexNormals();

window.shot = async (url, tint, yaw, pitch, upZ) => {
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x20242c); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;

  const hold = new THREE.Group(); hold.add(m); if (upZ) hold.rotation.x = -Math.PI / 2; scene.add(hold);
  const bb = new THREE.Box3().setFromObject(hold), c = bb.getCenter(new THREE.Vector3()), R = bb.getSize(new THREE.Vector3()).length() / 2;
  const cam = new THREE.PerspectiveCamera(26, W / H, R / 50, R * 50), y = yaw * Math.PI / 180, p = pitch * Math.PI / 180, D = R / Math.sin(13 * Math.PI / 180);
  cam.position.set(c.x + Math.sin(y) * Math.cos(p) * D, c.y + Math.sin(p) * D, c.z + Math.cos(y) * Math.cos(p) * D); cam.lookAt(c);
  const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(R, R * 2, R); scene.add(d);

</script></body></html>
